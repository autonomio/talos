[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "talos"
dynamic = ["version"]
description = "Reproducible parameter sweeps for Keras, TensorFlow and PyTorch"
keywords = ["hyperparameters", "parameter-sweep", "keras", "tensorflow", "pytorch", "reproducibility"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10,<3.14"
authors = [{name = "Mikko Kotila", email = "mailme@mikkokotila.com"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "polars>=1.30,<2",
  "scikit-learn>=1.5,<2", "scipy>=1.11,<2",
  "click>=8.3.3,<9", "ruamel.yaml>=0.18,<0.19", "tqdm>=4.66.3,<5",
  "requests>=2.33,<3", "typing_extensions>=4.12,<5",
  "tomli>=2,<3; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10", "hypothesis>=6.100,<7", "ruff==0.16.1", "pyright==1.1.408",
  "vulture>=2.14,<3", "coverage[toml]>=7.6,<8", "pyyaml>=6.0,<7",
  "pip-audit>=2.7,<3", "build>=1.2,<2", "hatchling==1.32.4", "editables>=0.5,<1",
]
keras = ["keras>=3.15,<4"]
tensorflow = ["tensorflow>=2.20,<3", "keras>=3.15,<4", "protobuf>=6.33.5,<8"]
torch = ["torch>=2.13,<3"]
legacy-tensorflow = ["tensorflow==2.14.1", "keras==2.14.0+autonomio.1", "protobuf==4.25.9+autonomio.1", "numpy>=1.26,<2"]
plots = ["matplotlib>=3.8,<4"]
samplers = []
test = ["pytest>=8,<10", "coverage>=7,<8", "build>=1.2,<2", "hatchling==1.32.4,<2", "editables>=0.5,<1", "ruff==0.16.1"]

[project.scripts]
talos = "talos.cli.main:cli"

[project.urls]
Homepage = "https://github.com/autonomio/talos"
Repository = "https://github.com/autonomio/talos"
Changelog = "https://github.com/autonomio/talos/blob/master/CHANGELOG.md"
Documentation = "https://autonomio.github.io/talos/"
Issues = "https://github.com/autonomio/talos/issues"

[tool.hatch.version]
path = "talos/__init__.py"

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["talos"]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = ["/talos", "/tests", "/examples", "/docs", "/README.md", "/CONTRIBUTING.md", "/CODE_OF_CONDUCT.md", "/NOTICE", "/LICENSE", "/pyproject.toml", "/tools", "/docs-site", "/.markdownlint.json", "/.gitignore", "/.pep8speaks.yml", "/logo.png", "/requirements.txt", "/test-ci.py", "/test-local.sh", "/AGENTS.md", "/CLAUDE.md", "/GOVERNANCE.md", "/MAINTAINERS.md", "/SECURITY.md", "/SUPPORT.md", "/SETUP.md", "/AUTONOMIO_PR_GUIDELINE.md", "/TALOS_REPO_SPECIFICS.md", "/THIRD_PARTY.md", "/CHANGELOG.md", "/AUTHORS", "/CITATION.cff", "/CITATION.bib", "/governance", "/governance.yml", "/scripts", "/requirements", "/.github"]
exclude = ["/docs-site/node_modules", "/docs-site/node_modules/**", "/docs-site/build", "/docs-site/build/**", "/docs-site/.generated", "/docs-site/.generated/**", "/docs-site/.docusaurus", "/docs-site/.docusaurus/**", "/docs-site/test-results", "/docs-site/test-results/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["commands", "performance", ".hypothesis"]
python_files = ["test_*.py"]
addopts = "--import-mode=importlib"
markers = ["backend: requires an optional deep learning backend"]

[tool.coverage.run]
source = ["talos"]
branch = true

[tool.coverage.report]
include = ["talos/*"]
show_missing = true

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"
include = ["talos"]
exclude = [
  "**/__pycache__",
  "build",
  "dist",
  "tests",
]
# governance/ is not type-checked in CI (include is the package), but listing it
# here lets the editor resolve the gates' bare `import _common` sibling import.
extraPaths = ["governance"]
stubPath = "stubs"
reportExplicitAny = "error"
reportMissingImports = "error"
reportMissingTypeStubs = "error"
reportUnknownArgumentType = "error"
reportUnknownMemberType = "error"
reportUnknownVariableType = "error"
reportUnknownLambdaType = "error"
reportUnknownParameterType = "error"
reportMissingParameterType = "error"
reportConstantRedefinition = "error"
reportImportCycles = "error"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
  ".git",
  "__pycache__",
  "build",
  "dist",
  "governance/tests/fixtures",
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# Preserve the documented compatibility check; governance/ruff.toml adds the strict gate.
select = ["E9", "F63", "F7", "F82"]
ignore = [
  "E501",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 12
max-statements = 50

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "S101", "ANN", "BLE001",
  "PLR0912", "PLR0913", "PLR0915",
  "D200", "D205", "D415",
]
"governance/*.py" = [
  "C901", "PLR0912", "PLR0913", "PLR0915",
  "T201",
  "FIX001", "FIX002", "FIX003", "FIX004",
  "ERA001", "D200", "D205", "D415",
]
"scripts/*.py" = [
  "C901", "PLR0912", "PLR0913", "PLR0915",
  "T201",
  "D200", "D205", "D415",
]
"governance/tests/**/*.py" = [
  "S101", "ANN", "BLE001",
  "PLR0912", "PLR0913", "PLR0915",
  "D200", "D205", "D415",
]

[tool.ruff.lint.isort]
known-first-party = ["governance", "talos"]

[tool.vulture]
paths = ["talos"]
min_confidence = 80


[tool.coverage.json]
output = "coverage.json"

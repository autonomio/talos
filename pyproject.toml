[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "talos"
dynamic = ["version"]
description = "Reproducible parameter sweeps for Keras, TensorFlow and PyTorch"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10,<3.14"
authors = [{name = "Mikko Kotila", email = "mailme@mikkokotila.com"}]
classifiers = [
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "polars>=1.30,<2",
  "scikit-learn>=1.3,<2", "scipy>=1.11,<2",
  "click>=8.1,<9", "ruamel.yaml>=0.18,<0.19", "tqdm>=4.66,<5",
  "requests>=2.31,<3", "typing_extensions>=4.12,<5",
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
keras = ["keras>=3.3,<4"]
tensorflow = ["tensorflow>=2.16,<3"]
torch = ["torch>=2.2,<3"]
legacy-tensorflow = ["tensorflow==2.14.1", "keras==2.14.0", "numpy>=1.26,<2"]
plots = ["matplotlib>=3.8,<4"]
samplers = ["chances>=0.1.9,<0.2"]
test = ["pytest>=8,<10", "coverage>=7,<8", "build>=1.2,<2", "ruff>=0.12,<1"]

[project.scripts]
talos = "talos.cli.main:cli"

[project.urls]
Homepage = "https://github.com/autonomio/talos"
Documentation = "https://autonomio.github.io/talos/"
Issues = "https://github.com/autonomio/talos/issues"

[tool.hatch.version]
path = "talos/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["talos"]

[tool.hatch.build.targets.sdist]
include = ["/talos", "/tests", "/examples", "/docs", "/README.md", "/NOTICE", "/LICENSE", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["commands", "performance"]
python_files = ["test_*.py"]
addopts = "--import-mode=importlib"
markers = ["backend: requires an optional deep learning backend"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.coverage.run]
source = ["talos"]
branch = true

[tool.coverage.report]
include = ["talos/*"]
show_missing = true

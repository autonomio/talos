schema_version: "1.0"
metadata:
  name: "tf_keras_experiment"
  mode: development
  description: "Caller-owned tf_keras params/prep/model example"
sfd:
  module: talos.sfd.templates.tf_keras
  backend: tensorflow
  task: regression
  objective: loss
uel:
  round_limit: 2
  seed: 42
  search_strategy:
    type: grid
  checkpoint_interval: 1
  save_models: true

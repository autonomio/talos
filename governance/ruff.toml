extend = "../pyproject.toml"

[lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "RUF",
  "BLE",
  "ANN",
  "C901",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "T201",
  "FIX001",
  "FIX002",
  "FIX003",
  "FIX004",
  "ERA001",
  "D200",
  "D205",
  "D415",
  "PIE790",
]
ignore = [
  "E501",
]

[lint.mccabe]
max-complexity = 10

[lint.pylint]
max-args = 6
max-branches = 12
max-statements = 50

[lint.per-file-ignores]
"tests/**/*.py" = [
  "S101", "ANN", "BLE001",
  "PLR0912", "PLR0913", "PLR0915",
  "D200", "D205", "D415",
]
"governance/*.py" = [
  "C901", "PLR0912", "PLR0913", "PLR0915",
  "T201",
  "FIX001", "FIX002", "FIX003", "FIX004",
  "ERA001", "D200", "D205", "D415",
]
"scripts/*.py" = [
  "C901", "PLR0912", "PLR0913", "PLR0915",
  "T201",
  "D200", "D205", "D415",
]
"governance/tests/**/*.py" = [
  "S101", "ANN", "BLE001",
  "PLR0912", "PLR0913", "PLR0915",
  "D200", "D205", "D415",
]

[lint.isort]
known-first-party = ["governance", "talos"]

<svg xmlns="http://www.w3.org/2000/svg" width="1488" height="1024" viewBox="0 0 1488 1024" role="img" aria-labelledby="title description">
<title id="title">One Keras fit and four native Talos trials</title>
<desc id="description">Executed code from the runnable keras_to_talos.py example. Keras trains one network. The native Talos SFD exposes params, prep and model, runs four combinations, retains artifacts, reloads the run and predicts with the model minimizing validation loss. Caller-owned bundled Iris data is shared.</desc>
<rect width="1488" height="1024" fill="#F7F7F2"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="400">
<text x="56" y="65" font-size="28" fill="#2A4A70">Keras to Talos</text>
<text x="56" y="115" font-size="22" fill="#252D33">One Keras fit</text>
<text x="780" y="115" font-size="22" fill="#252D33">Four Talos trials</text>
<text x="56" y="144" font-size="13" fill="#626B72">The existing five-argument callback</text>
<text x="780" y="144" font-size="13" fill="#626B72">Three SFD functions; the same callback</text>
<path d="M56 164H1432 M744 188V890 M56 916H1432" stroke="#D4DADD" stroke-width="1" fill="none"/>
<text x="56" y="197" font-size="13" fill="#252D33" xml:space="preserve">def existing_model(x_train, y_train, x_val, y_val, params):</text>
<text x="56" y="219.75" font-size="13" fill="#252D33" xml:space="preserve">    import keras</text>
<text x="56" y="265.25" font-size="13" fill="#252D33" xml:space="preserve">    keras.utils.set_random_seed(17)</text>
<text x="56" y="288" font-size="13" fill="#252D33" xml:space="preserve">    network = keras.Sequential([</text>
<text x="56" y="310.75" font-size="13" fill="#252D33" xml:space="preserve">        keras.layers.Input(shape=(x_train.shape[1],)),</text>
<text x="56" y="333.5" font-size="13" fill="#252D33" xml:space="preserve">        keras.layers.Dense(params.get(&#x27;units&#x27;, 8), activation=&#x27;relu&#x27;),</text>
<text x="56" y="356.25" font-size="13" fill="#252D33" xml:space="preserve">        keras.layers.Dense(3, activation=&#x27;softmax&#x27;),</text>
<text x="56" y="379" font-size="13" fill="#252D33" xml:space="preserve">    ])</text>
<text x="56" y="401.75" font-size="13" fill="#252D33" xml:space="preserve">    network.compile(</text>
<text x="56" y="424.5" font-size="13" fill="#252D33" xml:space="preserve">        optimizer=keras.optimizers.Adam(params.get(&#x27;learning_rate&#x27;, 0.01)),</text>
<text x="56" y="447.25" font-size="13" fill="#252D33" xml:space="preserve">        loss=&#x27;sparse_categorical_crossentropy&#x27;, metrics=[&#x27;accuracy&#x27;],</text>
<text x="56" y="470" font-size="13" fill="#252D33" xml:space="preserve">    )</text>
<text x="56" y="492.75" font-size="13" fill="#252D33" xml:space="preserve">    history = network.fit(</text>
<text x="56" y="515.5" font-size="13" fill="#252D33" xml:space="preserve">        x_train, y_train, validation_data=(x_val, y_val),</text>
<text x="56" y="538.25" font-size="13" fill="#252D33" xml:space="preserve">        epochs=params.get(&#x27;epochs&#x27;, 5), batch_size=params.get(&#x27;batch_size&#x27;, 16),</text>
<text x="56" y="561" font-size="13" fill="#252D33" xml:space="preserve">        verbose=0,</text>
<text x="56" y="583.75" font-size="13" fill="#252D33" xml:space="preserve">    )</text>
<text x="56" y="606.5" font-size="13" fill="#252D33" xml:space="preserve">    return history, network</text>
<text x="56" y="652" font-size="13" fill="#252D33" xml:space="preserve">my_splits = prepare_data()</text>
<text x="56" y="674.75" font-size="13" fill="#252D33" xml:space="preserve">history, network = existing_model(</text>
<text x="56" y="697.5" font-size="13" fill="#252D33" xml:space="preserve">    my_splits[&#x27;x_train&#x27;], my_splits[&#x27;y_train&#x27;],</text>
<text x="56" y="720.25" font-size="13" fill="#252D33" xml:space="preserve">    my_splits[&#x27;x_val&#x27;], my_splits[&#x27;y_val&#x27;],</text>
<text x="56" y="743" font-size="13" fill="#252D33" xml:space="preserve">    {&#x27;units&#x27;: 8, &#x27;learning_rate&#x27;: 0.01, &#x27;epochs&#x27;: 5, &#x27;batch_size&#x27;: 16},</text>
<text x="56" y="765.75" font-size="13" fill="#252D33" xml:space="preserve">)</text>
<text x="56" y="788.5" font-size="13" fill="#252D33" xml:space="preserve">baseline_predictions = network.predict(my_splits[&#x27;x_val&#x27;], verbose=0)</text>
<text x="780" y="197" font-size="13" fill="#252D33" xml:space="preserve">import talos</text>
<text x="780" y="242.5" font-size="13" fill="#252D33" xml:space="preserve">backend = &#x27;keras&#x27;</text>
<text x="780" y="288" font-size="13" fill="#252D33" xml:space="preserve">def params():</text>
<text x="780" y="310.75" font-size="13" fill="#252D33" xml:space="preserve">    return {</text>
<text x="780" y="333.5" font-size="13" fill="#252D33" xml:space="preserve">        &#x27;units&#x27;: [8, 16], &#x27;learning_rate&#x27;: [0.01, 0.03],</text>
<text x="780" y="356.25" font-size="13" fill="#252D33" xml:space="preserve">        &#x27;epochs&#x27;: [5], &#x27;batch_size&#x27;: [16],</text>
<text x="780" y="379" font-size="13" fill="#252D33" xml:space="preserve">    }</text>
<text x="780" y="424.5" font-size="13" fill="#252D33" xml:space="preserve">def prep(data, round_params):</text>
<text x="780" y="447.25" font-size="13" fill="#252D33" xml:space="preserve">    return data</text>
<text x="780" y="492.75" font-size="13" fill="#252D33" xml:space="preserve">def model(data, round_params):</text>
<text x="780" y="515.5" font-size="13" fill="#252D33" xml:space="preserve">    return existing_model(</text>
<text x="780" y="538.25" font-size="13" fill="#252D33" xml:space="preserve">        data[&#x27;x_train&#x27;], data[&#x27;y_train&#x27;], data[&#x27;x_val&#x27;], data[&#x27;y_val&#x27;],</text>
<text x="780" y="561" font-size="13" fill="#252D33" xml:space="preserve">        round_params,</text>
<text x="780" y="583.75" font-size="13" fill="#252D33" xml:space="preserve">    )</text>
<text x="780" y="629.25" font-size="13" fill="#252D33" xml:space="preserve">my_splits = prepare_data()</text>
<text x="780" y="652" font-size="13" fill="#252D33" xml:space="preserve">result = talos.run(</text>
<text x="780" y="674.75" font-size="13" fill="#252D33" xml:space="preserve">    __file__, data=my_splits, experiment_dir=output_dir / &#x27;sweep&#x27;,</text>
<text x="780" y="697.5" font-size="13" fill="#252D33" xml:space="preserve">    objective={&#x27;metric&#x27;: &#x27;val_loss&#x27;, &#x27;direction&#x27;: &#x27;min&#x27;}, seed=17,</text>
<text x="780" y="720.25" font-size="13" fill="#252D33" xml:space="preserve">    save_models=True, retain_models=True, prep_each_round=False,</text>
<text x="780" y="743" font-size="13" fill="#252D33" xml:space="preserve">    progress_bar=False,</text>
<text x="780" y="765.75" font-size="13" fill="#252D33" xml:space="preserve">)</text>
<text x="780" y="788.5" font-size="13" fill="#252D33" xml:space="preserve">recovered = talos.RunResult.load(result.run_dir)</text>
<text x="780" y="811.25" font-size="13" fill="#252D33" xml:space="preserve">predictions = recovered.predict(my_splits[&#x27;x_val&#x27;])</text>
<text x="56" y="949" font-size="13" fill="#626B72">Bundled Iris: 120 training / 30 validation rows. Scaling uses training rows only.</text>
<text x="56" y="974" font-size="13" fill="#626B72">Validation guides selection; these metrics are not a held-out test estimate.</text>
<a href="https://github.com/autonomio/talos/blob/master/examples/keras_to_talos.py"><text x="56" y="1002" font-size="13" fill="#2A4A70" text-decoration="underline">Run the complete example: keras_to_talos.py</text></a>
</g>
</svg>

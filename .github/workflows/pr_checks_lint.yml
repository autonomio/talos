name: pr_checks_lint

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pr_checks_tests:
    name: pr_checks_tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      coverage_artifact: ${{ steps.coverage.outputs.artifact-id }}

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'

      - name: Install package and test dependencies
        run: |
          python -m pip install --require-hashes -r requirements/ci/dev-env.txt
          python -m pip install --require-hashes -r requirements/ci/runtime-env.txt
          python -m pip install --require-hashes -r requirements/ci/build-tools.txt
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Resolve test coverage source
        id: package
        run: |
          python - <<'PYTHON' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import yaml
          source = yaml.safe_load(Path('governance.yml').read_text()).get('layout', {}).get('coverage_source')
          if not isinstance(source, str) or not source or not Path(source).is_dir():
              raise SystemExit('layout.coverage_source must name the maintained package directory')
          print(f'coverage_source={source}')
          PYTHON

      - name: Run package tests with coverage and runtime profile
        env:
          TEST_RUNTIME_PROFILE: runtime-artifacts/profile.json
        run: |
          python -m coverage run --branch --source="${{ steps.package.outputs.coverage_source }}" -m pytest -p governance.pytest_runtime tests/test_*.py -q --maxfail=1
          python -m coverage json -o coverage.json

      - name: Enforce the suite runtime budget
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ github.base_ref || 'master' }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=$AUTH" fetch origin "$BASE_REF" --depth=1
          printf '%s' "$PR_BODY" > pr_body.txt
          python governance/check_test_runtime.py \
            --profile runtime-artifacts/profile.json --enforce \
            --base-ref "origin/$BASE_REF" \
            --pr-body-file pr_body.txt

      - name: Run governance contracts and complete coverage
        run: |
          python -m coverage run --append --branch --source="${{ steps.package.outputs.coverage_source }}" -m pytest governance/tests/ -q
          python -m coverage json -o coverage.json
          python governance/coverage_evidence.py --write

      - name: Upload coverage artifact
        id: coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            coverage.json
            coverage-evidence.json

  pr_checks_lint:
    name: pr_checks_lint
    needs: pr_checks_tests
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require successful test evidence
        run: |
          test '${{ needs.pr_checks_tests.result }}' = success
          test -n '${{ needs.pr_checks_tests.outputs.coverage_artifact }}'

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install documentation toolchain
        run: npm --prefix docs-site ci

      - name: Install documentation browser
        run: node docs-site/node_modules/playwright/cli.js install --with-deps chromium

      - name: Audit documentation dependencies
        run: npm --prefix docs-site run security:audit

      - name: Check documentation site
        run: npm --prefix docs-site run check

      - name: Set up lint venv
        run: python -m venv .venv-lint

      - name: Install gate toolchain and project
        run: |
          uv pip install --python .venv-lint/bin/python --require-hashes -r requirements/ci/dev-env.txt
          uv pip install --python .venv-lint/bin/python --require-hashes -r requirements/ci/runtime-env.txt
          uv pip install --python .venv-lint/bin/python --require-hashes -r requirements/ci/build-tools.txt
          uv pip install --python .venv-lint/bin/python --no-build-isolation --no-deps -e .

      - name: Resolve layout
        id: package
        run: |
          set -euo pipefail
          .venv-lint/bin/python - <<'PY' >> "$GITHUB_OUTPUT"
          import sys
          from pathlib import Path

          import yaml

          layout = yaml.safe_load(Path('governance.yml').read_text()).get('layout', {})
          for key in ('package_root', 'coverage_source'):
              value = layout.get(key)
              if not isinstance(value, str) or not value:
                  sys.exit(f'governance.yml: layout.{key} must be a non-empty string')
              if not Path(value).is_dir():
                  sys.exit(f"governance.yml: layout.{key} '{value}' is not a directory")
              print(f'{key}={value}')

          # The lint plane's sub-checks are individually switchable, so a
          # repository can adopt part of it. Absent means on.
          lint = yaml.safe_load(Path('governance.yml').read_text()).get('gates', {}).get('lint', {})
          for key in ('ruff', 'module_budgets', 'dead_code',
                      'dependency_vulnerabilities', 'no_swallowed_violations'):
              value = lint.get(key, True)
              if not isinstance(value, bool):
                  sys.exit(f'governance.yml: gates.lint.{key} must be a boolean')
              print(f'{key}={str(value).lower()}')
          PY

      - name: Reject Python compiler warnings
        run: .venv-lint/bin/python -Werror -m compileall -q -f talos governance tests tools scripts examples

      - name: Enforce selected Python style with zero findings
        run: .venv-lint/bin/python -m ruff check --config governance/ruff.toml --preview --select E,W,I,D200,D205,D415,RUF022 --ignore E501 talos governance tests tools scripts examples

      - name: Ratchet Ruff and dead-code findings against the source baseline
        env:
          BASE_REF: ${{ github.base_ref || 'master' }}
        run: .venv-lint/bin/python governance/check_quality_debt.py --base-ref "origin/$BASE_REF"

      - name: Module line-count budget gate
        if: steps.package.outputs.module_budgets == 'true'
        run: .venv-lint/bin/python governance/check_module_budgets.py

      - name: Module docstring gate
        run: .venv-lint/bin/python governance/check_module_docstrings.py

      - name: Docstring conventions gate
        run: .venv-lint/bin/python governance/check_docstrings.py

      - name: File size balance gate
        run: .venv-lint/bin/python governance/check_file_size_balance.py

      - name: Test/code SLOC ratio gate
        run: .venv-lint/bin/python governance/check_test_code_ratio.py

      - name: No-swallowed-violations gate
        if: steps.package.outputs.no_swallowed_violations == 'true'
        run: .venv-lint/bin/python governance/check_no_swallowed_violations.py

      - name: Test fallback gate
        run: .venv-lint/bin/python governance/check_test_fallbacks.py

      - name: Dependency vulnerability gate
        if: steps.package.outputs.dependency_vulnerabilities == 'true'
        run: .venv-lint/bin/python governance/check_dependency_vulnerabilities.py

      - name: Download tested coverage from this workflow run
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          artifact-ids: ${{ needs.pr_checks_tests.outputs.coverage_artifact }}

      - name: Verify test evidence and enforce coverage floor
        run: |
          .venv-lint/bin/python governance/coverage_evidence.py --verify
          .venv-lint/bin/python governance/check_coverage_floor.py

      - name: Diff coverage gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ github.base_ref || 'master' }}
        run: |
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=$AUTH" fetch origin "$BASE_REF"
          .venv-lint/bin/python governance/check_diff_coverage.py --base-ref "origin/$BASE_REF"

      - name: Budget-raise ratchet gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref || 'master' }}
        run: |
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=$AUTH" fetch origin "$BASE_REF" --depth=1
          .venv-lint/bin/python governance/check_budget_ratchet.py \
            --base-ref "origin/$BASE_REF" \
            --pr-number "$PR_NUMBER"

      - name: Coverage ratchet gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref || 'master' }}
        run: |
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=$AUTH" fetch origin "$BASE_REF" --depth=1
          .venv-lint/bin/python governance/check_coverage_ratchet.py \
            --base-ref "origin/$BASE_REF" \
            --pr-number "$PR_NUMBER"

  publish_coverage_comment:
    name: publish_coverage_comment
    # Informational only. It must never block a merge, so it is a separate job
    # that is not a required check and does not fail the PR when the upstream
    # test job produced no artifact.
    if: ${{ github.event_name == 'pull_request' && always() }}
    needs: pr_checks_tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Download coverage artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          artifact-ids: ${{ needs.pr_checks_tests.outputs.coverage_artifact }}

      - name: Publish coverage comment
        if: ${{ steps.download.outcome == 'success' && hashFiles('coverage.json') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          summary="$(python - <<'PY'
          import json
          from pathlib import Path

          totals = json.loads(Path('coverage.json').read_text())['totals']
          line = totals['percent_statements_covered']
          branch = totals['percent_branches_covered']
          print(
              '<!-- coverage-comment -->\n'
              '### Coverage\n\n'
              f'| line | branch | statements | missing |\n'
              f'| --- | --- | --- | --- |\n'
              f'| {line:.1f}% | {branch:.1f}% | '
              f'{totals.get("num_statements", 0)} | {totals.get("missing_lines", 0)} |'
          )
          PY
          )"
          existing="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '[.[] | select(.body | startswith("<!-- coverage-comment -->")) | .id] | first // empty')"
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -f body="$summary" >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$summary" >/dev/null
          fi

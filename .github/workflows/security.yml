name: Dependency audit
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  supported:
    name: Supported dependencies (${{ matrix.lane }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: core
            python: '3.10'
            extras: ''
          - lane: current-frameworks
            python: '3.12'
            extras: '[tensorflow,keras,torch]'
          - lane: minimum-frameworks
            python: '3.11'
            extras: '[tensorflow,keras,torch]'
            minimum: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install current supported dependencies
        if: ${{ !matrix.minimum }}
        run: python -m pip install '.${{ matrix.extras }}' pip-audit
      - name: Install supported minimum frameworks
        if: ${{ matrix.minimum }}
        run: >-
          python -m pip install '.${{ matrix.extras }}' pip-audit
          'tensorflow==2.20.0' 'keras==3.15.0' 'torch==2.13.0'
          'protobuf==6.33.5' 'numpy==1.26.4' 'scikit-learn==1.5.0'
      - run: pip-audit --strict --format json --output audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit-${{ matrix.lane }}
          path: audit.json
  legacy-report:
    name: Legacy TensorFlow compatibility advisory report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[legacy-tensorflow]' pip-audit
      - name: Record legacy upstream advisories
        continue-on-error: true
        run: pip-audit --strict --format json --output legacy-audit.json
      - name: Summarize compatibility-only findings
        if: always()
        run: |
          python - <<'PY'
          import json, os
          report = json.load(open('legacy-audit.json'))
          findings = [item for item in report['dependencies'] if item.get('vulns')]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Legacy TensorFlow is a compatibility lane; its upstream advisories are reported separately from the supported dependency gate.\n\n')
              for item in findings:
                  summary.write(f"- {item['name']} {item['version']}: {len(item['vulns'])} advisory entries\n")
              if not findings:
                  summary.write('No known vulnerabilities found in this resolved legacy environment.\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit-legacy-compatibility
          path: legacy-audit.json

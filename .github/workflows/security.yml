name: Dependency audit
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  supported:
    name: Supported dependencies (${{ matrix.lane }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: core
            python: '3.10'
            lock: core-3.10.txt
          - lane: current-frameworks
            python: '3.12'
            lock: documentation-3.12.txt
          - lane: minimum-frameworks
            python: '3.11'
            lock: minimum-3.11.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the hash-locked audit lane
        run: python -m pip install --require-hashes -r requirements/ci/${{ matrix.lock }}
      - name: Bind installed locked dependencies to upstream advisory identities
        run: python scripts/prepare_dependency_audit.py --lock requirements/ci/${{ matrix.lock }} --requirements audit-requirements.txt --identities audit-identities.json
      - name: Audit every supported locked dependency
        run: pip-audit --strict --disable-pip --no-deps -r audit-requirements.txt --format json --output audit.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: dependency-audit-${{ matrix.lane }}
          path: |
            audit.json
            audit-identities.json
            audit-requirements.txt
  legacy-report:
    name: Legacy TensorFlow compatibility advisory report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.11'
      - run: python -m pip install --require-hashes -r requirements/ci/legacy-3.11.txt
      - name: Record legacy upstream advisories
        continue-on-error: true
        run: pip-audit --strict --require-hashes -r requirements/ci/legacy-3.11.txt --format json --output legacy-audit.json
      - name: Summarize compatibility-only findings
        if: always()
        run: |
          python - <<'PY'
          import json, os
          report = json.load(open('legacy-audit.json'))
          findings = [item for item in report['dependencies'] if item.get('vulns')]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Legacy TensorFlow is a compatibility lane; its upstream advisories are reported separately from the supported dependency gate.\n\n')
              for item in findings:
                  summary.write(f"- {item['name']} {item['version']}: {len(item['vulns'])} advisory entries\n")
              if not findings:
                  summary.write('No known vulnerabilities found in this resolved legacy environment.\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: dependency-audit-legacy-compatibility
          path: legacy-audit.json

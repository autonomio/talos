name: Create reviewed release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact reviewed release tag matching the current source version (vMAJOR.MINOR.PATCH).
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  post_release:
    name: Create reviewed release
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'
      - name: Configure release identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Create the explicitly selected tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ github.sha }}
        run: python scripts/create_release.py --tag "$RELEASE_TAG" --expected-sha "$EXPECTED_SHA" --publish

name: pr_checks_tests

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr_checks_tests:
    name: pr_checks_tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'

      - name: Install package and test dependencies
        run: |
          python -m pip install --require-hashes -r requirements/ci/dev-env.txt
          python -m pip install --require-hashes -r requirements/ci/runtime-env.txt
          python -m pip install --require-hashes -r requirements/ci/build-tools.txt
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Run package tests with coverage and runtime profile
        env:
          TEST_RUNTIME_PROFILE: runtime-artifacts/profile.json
        run: |
          python -m coverage run --branch --source=talos -m pytest -p governance.pytest_runtime tests/test_*.py -q --maxfail=1
          python -m coverage json -o coverage.json

      - name: Enforce the suite runtime budget
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ github.base_ref || 'master' }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=$AUTH" fetch origin "$BASE_REF" --depth=1
          printf '%s' "$PR_BODY" > pr_body.txt
          python governance/check_test_runtime.py \
            --profile runtime-artifacts/profile.json --enforce \
            --base-ref "origin/$BASE_REF" \
            --pr-body-file pr_body.txt

      - name: Upload coverage artifact
        if: ${{ always() && hashFiles('coverage.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-data
          path: coverage.json

  publish_coverage_comment:
    name: publish_coverage_comment
    # Informational only. It must never block a merge, so it is a separate job
    # that is not a required check and does not fail the PR when the upstream
    # test job produced no artifact.
    if: ${{ github.event_name == 'pull_request' && always() }}
    needs: pr_checks_tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false

      - name: Download coverage artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: coverage-data

      - name: Publish coverage comment
        if: ${{ steps.download.outcome == 'success' && hashFiles('coverage.json') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          summary="$(python - <<'PY'
          import json
          from pathlib import Path

          totals = json.loads(Path('coverage.json').read_text())['totals']
          line = totals['percent_statements_covered']
          branch = totals['percent_branches_covered']
          print(
              '<!-- coverage-comment -->\n'
              '### Coverage\n\n'
              f'| line | branch | statements | missing |\n'
              f'| --- | --- | --- | --- |\n'
              f'| {line:.1f}% | {branch:.1f}% | '
              f'{totals.get("num_statements", 0)} | {totals.get("missing_lines", 0)} |'
          )
          PY
          )"
          existing="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '[.[] | select(.body | startswith("<!-- coverage-comment -->")) | .id] | first // empty')"
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -f body="$summary" >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$summary" >/dev/null
          fi

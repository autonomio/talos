name: pr_checks_packaging

# Verifies what the repository would actually ship. `pr_checks_tests` proves
# the source works; this proves the distribution built from it is the one a
# consumer receives.
#
# The reproducibility check is the load-bearing one: two builds of identical
# source must produce byte-identical artifacts. Without it "reproducible
# build" is a claim rather than a property, and the release path's provenance
# attestation attests to something nobody verified.

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr_checks_packaging:
    name: pr_checks_packaging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'

      - name: Install packaging tools
        run: |
          python -m pip install --require-hashes -r requirements/ci/build-tools.txt
          python -m pip install --require-hashes -r requirements/ci/packaging-tools.txt
          python -m pip install --require-hashes -r requirements/ci/gate-tools.txt

      - name: Check release, setup and distribution refusal contracts
        run: python -m unittest discover -s scripts/tests -v

      - name: Build twice under a fixed SOURCE_DATE_EPOCH
        env:
          SOURCE_DATE_EPOCH: '1704067200'
        run: |
          set -euo pipefail
          python -m build --no-isolation --outdir dist-first
          python -m build --no-isolation --outdir dist-second

      - name: Assert the two builds are byte-identical
        run: |
          set -euo pipefail
          first="$(cd dist-first && sha256sum ./* | sort -k2)"
          second="$(cd dist-second && sha256sum ./* | sort -k2)"
          echo "$first"
          if [ -z "$first" ]; then
            echo "::error::no artifacts were built"
            exit 1
          fi
          if [ "$first" != "$second" ]; then
            echo "::error::builds are not reproducible"
            diff <(echo "$first") <(echo "$second") || true
            exit 1
          fi
          echo "reproducible: $(echo "$first" | wc -l) artifact(s) identical across builds"

      - name: Stage the distributions
        run: |
          rm -rf dist
          mv dist-first dist

      - name: Audit the distribution contents
        run: python scripts/package_audit.py

      - name: Validate metadata and manifest
        run: |
          set -euo pipefail
          python -m twine check dist/*
          python -m check_manifest
          min_score="$(python - <<'PY'
          import sys
          from pathlib import Path

          import yaml

          # gates.packaging.pyroma_min -- the metadata score this repository
          # holds itself to. Absent means the template's own 9.
          value = (
              yaml.safe_load(Path('governance.yml').read_text())
              .get('gates', {}).get('packaging', {}).get('pyroma_min', 9)
          )
          if not isinstance(value, int) or isinstance(value, bool) or not 1 <= value <= 10:
              sys.exit(f'governance.yml: gates.packaging.pyroma_min must be 1-10, got {value!r}')
          print(value)
          PY
          )"
          python -m pyroma --min="$min_score" .

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: distributions
          path: dist

  pr_checks_package_install:
    name: pr_checks_package_install (${{ matrix.python-version }})
    needs: pr_checks_packaging
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.10'
            lock: core-3.10.txt
          - python-version: '3.11'
            lock: core-3.11.txt
          - python-version: '3.12'
            lock: core-3.12.txt
          - python-version: '3.13'
            lock: core-3.13.txt

    steps:
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false

      - name: Download distributions
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: distributions
          path: dist

      - name: Install declared core dependencies
        run: python -m pip install --require-hashes -r requirements/ci/${{ matrix.lock }}
      - name: Install the built wheel
        run: python -m pip install --no-deps dist/*.whl

      - name: Import the installed package and agree with its metadata
        env:
          DIST_NAME: talos
          PACKAGE_NAME: talos
        run: |
          set -euo pipefail
          # Run from outside the checkout: importing inside it would load the
          # source tree and prove nothing about the installed wheel.
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import importlib
          import importlib.metadata as md
          import os
          import sys

          dist_name = os.environ['DIST_NAME']
          package = os.environ['PACKAGE_NAME']
          module = importlib.import_module(package)
          forbidden = {'tensorflow', 'keras', 'torch', 'matplotlib', 'pyarrow'}
          if forbidden.intersection(sys.modules):
              raise SystemExit('core import eagerly loaded an optional backend')
          installed = md.version(dist_name)
          declared = getattr(module, '__version__', installed)
          print(f'{package} {declared} from {module.__file__} (dist {dist_name} {installed})')
          if declared != installed:
              raise SystemExit(
                  f'__version__ {declared!r} disagrees with distribution metadata {installed!r}'
              )
          if 'site-packages' not in (module.__file__ or ''):
              raise SystemExit(f'imported {module.__file__}, not the installed wheel')
          PY

      - name: Check the installed dependency set is consistent
        run: python -m pip check

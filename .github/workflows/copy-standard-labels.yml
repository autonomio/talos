name: Configure declared Talos labels
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  setup:
    permissions:
      contents: read
      issues: write
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'
      - name: Upsert local labels without deleting unrelated labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/configure_repository.py --repo "$GITHUB_REPOSITORY" --labels-only --apply

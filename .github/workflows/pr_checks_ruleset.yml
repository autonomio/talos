name: pr_checks_ruleset

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr_checks_ruleset:
    name: pr_checks_ruleset
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up contract venv
        run: python -m venv .venv-ruleset

      - name: Install contract dependencies
        run: .venv-ruleset/bin/python -m pip install --require-hashes -r requirements/ci/dev-env.txt

      - name: Run CI contract tests
        run: .venv-ruleset/bin/python -m pytest governance/tests/test_cc_gate.py governance/tests/test_ruleset_gate.py governance/tests/test_privileged_ruleset_audit.py governance/tests/test_ci_contract.py governance/tests/test_lint_ci_contract.py governance/tests/test_tests_ci_contract.py governance/tests/test_bootstrap_workflow_contract.py governance/tests/test_codeql_fallback.py -q

      - name: Compare live ruleset to checked-in snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${{ vars.RULESET_ID }}" ]; then
            echo "::error::repository variable RULESET_ID is not set. Configure it to the live Protect-Master ruleset id."
            exit 2
          fi
          .venv-ruleset/bin/python governance/ruleset_gate.py \
            --ruleset-file .github/rulesets/master.json \
            --repo "${{ github.repository }}" \
            --ruleset-id "${{ vars.RULESET_ID }}"

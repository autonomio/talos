name: pr_checks_honesty

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr_checks_honesty:
    name: pr_checks_honesty
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Install package and test dependencies
        run: |
          python -m pip install --require-hashes -r requirements/ci/dev-env.txt
          python -m pip install --require-hashes -r requirements/ci/runtime-env.txt
          python -m pip install --require-hashes -r requirements/ci/build-tools.txt
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Run honesty gate suite
        run: pytest governance/tests/test_repository_law.py -v --tb=short

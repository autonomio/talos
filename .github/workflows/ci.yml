name: Test and build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test,plots,samplers]'
      - run: ruff check talos tests/test_*.py
      - run: coverage run -m pytest -q
      - run: coverage report
      - run: python -m build
      - name: Verify installed wheel outside the checkout
        run: |
          python -m venv /tmp/talos-wheel
          for wheel in dist/*.whl; do
            /tmp/talos-wheel/bin/pip install "${wheel}[test,plots,samplers]"
          done
          mkdir -p /tmp/talos-wheel-tests/tests /tmp/talos-wheel-tests/examples/sfd /tmp/talos-wheel-tests/talos/sfd/templates
          cp tests/__init__.py tests/test_*.py /tmp/talos-wheel-tests/tests/
          cp examples/sfd/*.py /tmp/talos-wheel-tests/examples/sfd/
          cp talos/sfd/templates/keras.py talos/sfd/templates/tf_keras.py talos/sfd/templates/pytorch.py /tmp/talos-wheel-tests/talos/sfd/templates/
          cd /tmp
          /tmp/talos-wheel/bin/python -c 'import sys,talos; from talos.experiment import run; assert not {"tensorflow","keras","torch","matplotlib","pyarrow"}.intersection(sys.modules)'
          /tmp/talos-wheel/bin/talos --help
          cd /tmp/talos-wheel-tests
          /tmp/talos-wheel/bin/python -m pytest -q --import-mode=importlib tests
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.python }}
          path: dist/*
  backends:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            extras: 'legacy-tensorflow'
            keras_backend: tensorflow
          - python: '3.12'
            extras: 'tensorflow,keras'
            keras_backend: tensorflow
          - python: '3.12'
            extras: 'torch,keras'
            keras_backend: torch
          - python: '3.11'
            extras: 'tensorflow,keras,torch'
            keras_backend: tensorflow
            minimum: true
    env:
      KERAS_BACKEND: ${{ matrix.keras_backend }}
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install current frameworks
        if: ${{ !matrix.minimum }}
        run: python -m pip install '.[test,plots,samplers,${{ matrix.extras }}]'
      - name: Install supported minimum frameworks
        if: ${{ matrix.minimum }}
        run: >-
          python -m pip install '.[test,plots,samplers,${{ matrix.extras }}]'
          'tensorflow==2.20.0' 'keras==3.15.0' 'torch==2.13.0'
          'protobuf==6.33.5' 'numpy==1.26.4' 'scikit-learn==1.5.0'
      - run: python -m pytest -q

  documentation:
    name: Execute documentation and examples
    runs-on: ubuntu-latest
    env:
      KERAS_BACKEND: tensorflow
      KERAS_TORCH_DEVICE: cpu
      CUDA_VISIBLE_DEVICES: '-1'
      TF_NUM_INTRAOP_THREADS: '1'
      TF_NUM_INTEROP_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[tensorflow,keras,torch,plots,samplers,test]'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm --prefix docs-site ci
      - run: npm --prefix docs-site exec -- playwright install --with-deps chromium
      - run: python tools/verify_documentation.py --output-dir verification-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-verification
          path: verification-output/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-browser-proof
          path: docs-site/test-results/

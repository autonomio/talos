name: Build signed release and optionally publish PyPI
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag matching this reviewed master commit.
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-assets-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'release' || github.ref == 'refs/heads/master'
    outputs:
      source_sha: ${{ steps.reviewed_source.outputs.source_sha }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'
      - name: Validate reviewed release commit
        id: reviewed_source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::release tag must use vMAJOR.MINOR.PATCH'
            exit 1
          fi
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=$AUTH" fetch origin refs/heads/master:refs/remotes/origin/master --no-tags
          RELEASE_SHA=$(git rev-parse --verify "$RELEASE_TAG^{commit}")
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/master; then
            echo '::error::release commit has not been integrated into protected master'
            exit 1
          fi
          if [ "$RELEASE_SHA" != "$GITHUB_SHA" ] || [ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]; then
            echo '::error::release tag, checkout and attested workflow source must identify the same commit'
            exit 1
          fi
          printf 'source_sha=%s\n' "$RELEASE_SHA" >> "$GITHUB_OUTPUT"
      - name: Validate published tag and package version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          RELEASE_METADATA: ${{ runner.temp }}/release.json
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName > "$RELEASE_METADATA"
          python - <<'PY'
          import json
          import os
          import sys
          sys.path.insert(0, 'scripts')
          from create_release import compute_tag, current_version
          released = json.load(open(os.environ['RELEASE_METADATA']))
          tag = os.environ['RELEASE_TAG']
          if released['isDraft'] or released['tagName'] != tag or tag != compute_tag(current_version()):
              raise SystemExit('selected release tag and source version disagree')
          PY
      - name: Install locked build and validation tooling
        run: |
          python -m pip install --require-hashes -r requirements/ci/build-tools.txt
          python -m pip install --require-hashes -r requirements/ci/packaging-tools.txt
          python -m pip install --require-hashes -r requirements/ci/dev-env.txt
      - name: Guard against a reused PyPI version
        if: vars.PYPI_PUBLISH_ENABLED == 'true'
        run: |
          python - <<'PY'
          import json
          import sys
          import urllib.error
          import urllib.request
          sys.path.insert(0, 'scripts')
          from create_release import current_version
          try:
              with urllib.request.urlopen('https://pypi.org/pypi/talos/json', timeout=30) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              payload = {'releases': {}}
          version = current_version()
          if version in payload['releases']:
              raise SystemExit(f'PyPI already records Talos {version}; increment the version before publishing')
          print(f'Talos {version} is available on PyPI')
          PY
      - name: Test the released source with current supported frameworks
        env:
          KERAS_BACKEND: tensorflow
          CUDA_VISIBLE_DEVICES: '-1'
          OMP_NUM_THREADS: '1'
        run: |
          python -m pip install --require-hashes -r requirements/ci/documentation-3.12.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pytest -q
      - name: Build and validate the distribution
        env:
          SOURCE_DATE_EPOCH: '1704067200'
        run: |
          python -m build --no-isolation
          python scripts/package_audit.py
          python -m twine check dist/*
      - name: Build reproducible owned legacy security wheels
        run: python -m tools.security.wheels --cache build/legacy-wheel-cache --output build/legacy-security
      - name: Record artifact digests
        run: |
          set -euo pipefail
          mkdir release-evidence
          (cd dist && sha256sum -- *.whl *.tar.gz) > release-evidence/SHA256SUMS
          (cd build/legacy-security && sha256sum -- *.whl) >> release-evidence/SHA256SUMS
          {
            echo '### Artifact SHA-256'
            echo
            echo '```'
            cat release-evidence/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Attest build provenance
        id: attestation
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a  # v3.0.0
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            build/legacy-security/*.whl
            release-evidence/SHA256SUMS
      - name: Retain the authentic Sigstore bundle
        env:
          BUNDLE_PATH: ${{ steps.attestation.outputs.bundle-path }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: cp -- "$BUNDLE_PATH" "release-evidence/talos-${RELEASE_TAG}.sigstore.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-evidence
          path: |
            release-evidence/SHA256SUMS
            release-evidence/*.sigstore.json
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: legacy-security-wheels
          path: build/legacy-security/*.whl
          if-no-files-found: error
  release_assets:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: release-dist
          path: dist
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: release-evidence
          path: release-evidence
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: legacy-security-wheels
          path: dist
      - name: Verify and attach immutable release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          set -euo pipefail
          BUNDLE="release-evidence/talos-${RELEASE_TAG}.sigstore.json"
          (cd dist && sha256sum --check ../release-evidence/SHA256SUMS)
          for artifact in dist/*.whl dist/*.tar.gz release-evidence/SHA256SUMS; do
            gh attestation verify "$artifact" --bundle "$BUNDLE" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/deploy.yml" \
              --source-digest "$SOURCE_SHA" --source-ref "$GITHUB_REF" --deny-self-hosted-runners
          done
          RELEASE_STATE=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName --jq 'if .isDraft then "draft" else .tagName end')
          if [ "$RELEASE_STATE" != "$RELEASE_TAG" ]; then
            echo '::error::selected GitHub release is not published at the expected tag'
            exit 1
          fi
          EXISTING_ASSETS=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for artifact in dist/*.whl dist/*.tar.gz release-evidence/SHA256SUMS "$BUNDLE"; do
            while IFS= read -r existing; do
              if [ "$existing" = "$(basename "$artifact")" ]; then
                echo "::error::release asset already exists: $existing; immutable assets cannot be replaced"
                exit 1
              fi
            done <<< "$EXISTING_ASSETS"
          done
          gh release upload "$RELEASE_TAG" dist/*.whl dist/*.tar.gz release-evidence/SHA256SUMS "$BUNDLE" --repo "$GITHUB_REPOSITORY"
  publish:
    if: vars.PYPI_PUBLISH_ENABLED == 'true'
    needs: [build, release_assets]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: release-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e  # v1.13.0

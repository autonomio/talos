name: Publish release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag to validate and upload.
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pypi-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  build:
    if: >-
      vars.PYPI_PUBLISH_ENABLED == 'true' &&
      (github.event_name == 'release' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'
      - name: Validate published tag and package version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          RELEASE_METADATA: ${{ runner.temp }}/release.json
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName > "$RELEASE_METADATA"
          python - <<'PY'
          import json
          import os
          import sys
          sys.path.insert(0, 'scripts')
          from create_release import compute_tag, current_version
          released = json.load(open(os.environ['RELEASE_METADATA']))
          tag = os.environ['RELEASE_TAG']
          if released['isDraft'] or released['tagName'] != tag or tag != compute_tag(current_version()):
              raise SystemExit('selected release tag and source version disagree')
          PY
      - name: Install locked build and validation tooling
        run: |
          python -m pip install --require-hashes -r requirements/ci/build-tools.txt
          python -m pip install --require-hashes -r requirements/ci/packaging-tools.txt
          python -m pip install --require-hashes -r requirements/ci/dev-env.txt
      - name: Guard against a reused PyPI version
        run: |
          python - <<'PY'
          import json
          import sys
          import urllib.error
          import urllib.request
          sys.path.insert(0, 'scripts')
          from create_release import current_version
          try:
              with urllib.request.urlopen('https://pypi.org/pypi/talos/json', timeout=30) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              payload = {'releases': {}}
          version = current_version()
          if version in payload['releases']:
              raise SystemExit(f'PyPI already records Talos {version}; increment the version before publishing')
          print(f'Talos {version} is available on PyPI')
          PY
      - name: Test the released source with current supported frameworks
        env:
          KERAS_BACKEND: tensorflow
          CUDA_VISIBLE_DEVICES: '-1'
          OMP_NUM_THREADS: '1'
        run: |
          python -m pip install --require-hashes -r requirements/ci/documentation-3.12.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pytest -q
      - name: Build and validate the distribution
        env:
          SOURCE_DATE_EPOCH: '1704067200'
        run: |
          python -m build --no-isolation
          python scripts/package_audit.py
          python -m twine check dist/*
      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a  # v3.0.0
        with:
          subject-path: dist/*
      - name: Record artifact digests
        run: |
          {
            echo '### Artifact SHA-256'
            echo
            echo '```'
            (cd dist && sha256sum ./*)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-dist
          path: dist/*
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: release-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e  # v1.13.0
